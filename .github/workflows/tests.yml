name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Syntax check
        run: luac5.4 -p Jinriki_FilenamePitch_to_Target_Soloist.lua

      - name: Run pure-function tests
        run: lua5.4 tests/test_core.lua

      - name: Run REAPER API mock tests
        run: lua5.4 tests/test_reaper_logic.lua

      - name: Validate ReaPack index
        run: python3 tests/check_index.py

      - name: Check benchmark syntax
        run: python3 -m py_compile tools/pitch_benchmark.py

      - name: Install benchmark dependency
        run: python3 -m pip install numpy

      - name: Run benchmark self-test
        run: python3 tools/pitch_benchmark.py --self-test --lua lua5.4
