name: ReaPack index

on:
  push:
    branches: [main]
    paths-ignore:
      - index.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build index.xml
        run: node tools/build-index.mjs

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.xml; then
            echo "index.xml is up to date"
            exit 0
          fi
          git add index.xml
          git commit -m "Update ReaPack index"
          git push
